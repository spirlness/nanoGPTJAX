name: KV cache tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  kvcache-consistency:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      # The checked-in lockfile predates the Grain dependency. Let uv resolve
      # until that lockfile is refreshed in a dedicated dependency update.
      - name: Install project dependencies
        run: uv sync

      - name: Run KV cache consistency tests
        run: uv run python -m unittest tests.test_kvcache_consistency
